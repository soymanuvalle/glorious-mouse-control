[package]
name = "glorious-mouse-control"
version = "0.3.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = true

[dependencies]
clap = { version = "3.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xdg = "2.4"

# Linux / Windows / etc: raw USB control transfers via libusb.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusb = "0.9"

# macOS: Apple's HID stack owns the mouse, so libusb cannot claim interfaces.
# Use hidapi (IOKit) to send the same HID feature reports instead.
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", features = ["macos-shared-device"] }
